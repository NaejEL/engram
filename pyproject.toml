[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engram"
version = "0.1.0"
description = "PoC hippocampe/néocortex : fast weights plastiques à test-time sur un LLM gelé"
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "transformers>=4.44"]

[tool.setuptools]
packages = ["engram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
